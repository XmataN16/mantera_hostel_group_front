<app-page-header
  title="Справочник отелей"
  subtitle="Управление объектами размещения сети Mantera">
  <button
    pButton
    type="button"
    label="Добавить отель"
    icon="pi pi-plus"
    (click)="openDialog()">
  </button>
</app-page-header>

<p-table
  [value]="hotels()"
  [loading]="isLoading()"
  styleClass="p-datatable-gridlines"
  responsiveLayout="scroll"
  [paginator]="true"
  [rows]="10"
  [rowsPerPageOptions]="[10, 25, 50]">

  <ng-template pTemplate="header">
    <tr>
      <th>ID</th>
      <th>Название</th>
      <th>Короткое имя</th>
      <th>Адрес</th>
      <th>Телефон</th>
      <th>Email</th>
      <th>Статус</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-hotel>
    <tr>
      <td>{{ hotel.id }}</td>
      <td>
        <strong>{{ hotel.name }}</strong>
      </td>
      <td>{{ hotel.shortName || '-' }}</td>
      <td>{{ hotel.address }}</td>
      <td>{{ hotel.phone || '-' }}</td>
      <td>{{ hotel.email || '-' }}</td>
      <td>
        <app-status-badge
          [label]="getHotelStatusLabel(hotel.status)"
          [severity]="getHotelStatusSeverity(hotel.status)">
        </app-status-badge>
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="7">
        <app-empty-state message="Отели не найдены. Добавьте первый отель!"></app-empty-state>
      </td>
    </tr>
  </ng-template>
</p-table>

<!-- ========================================================= -->
<!-- ДИАЛОГ: СОЗДАНИЕ ОТЕЛЯ -->
<!-- ========================================================= -->
<p-dialog
  [visible]="displayDialog()"
  (visibleChange)="displayDialog.set($event)"
  [modal]="true"
  [style]="{ width: '500px' }"
  header="Новый отель"
  [closable]="true">

  <div class="hotel-form">
    <div class="field">
      <label for="name">Название *</label>
      <input
        id="name"
        type="text"
        pInputText
        [(ngModel)]="newHotel.name"
        placeholder="Например: Hotel Mantera Grand"
        class="w-full" />
    </div>

    <div class="field">
      <label for="shortName">Короткое имя</label>
      <input
        id="shortName"
        type="text"
        pInputText
        [(ngModel)]="newHotel.shortName"
        placeholder="Например: Mantera Grand"
        class="w-full" />
    </div>

    <div class="field">
      <label for="address">Адрес *</label>
      <input
        id="address"
        type="text"
        pInputText
        [(ngModel)]="newHotel.address"
        placeholder="Полный адрес отеля"
        class="w-full" />
    </div>

    <div class="field">
      <label for="phone">Телефон</label>
      <input
        id="phone"
        type="text"
        pInputText
        [(ngModel)]="newHotel.phone"
        placeholder="+7 (XXX) XXX-XX-XX"
        class="w-full" />
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        pInputText
        [(ngModel)]="newHotel.email"
        placeholder="hotel@example.ru"
        class="w-full" />
    </div>
  </div>

  <ng-template pTemplate="footer">
    <button
      pButton
      type="button"
      label="Отмена"
      severity="secondary"
      (click)="displayDialog.set(false)">
    </button>
    <button
      pButton
      type="button"
      label="Сохранить"
      icon="pi pi-check"
      (click)="saveHotel()">
    </button>
  </ng-template>
</p-dialog>
