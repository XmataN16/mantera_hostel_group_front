<app-page-header
  title="Номерной фонд"
  subtitle="Управление номерами, статусами и уборкой">
  <button
    pButton
    type="button"
    label="Добавить номер"
    icon="pi pi-plus"
    (click)="openDialog()">
  </button>
</app-page-header>

<div class="toolbar">
  <div class="field hotel-filter">
    <label for="hotelId">Отель</label>
    <p-dropdown
      inputId="hotelId"
      [options]="hotels()"
      [ngModel]="selectedHotelId()"
      (ngModelChange)="selectedHotelId.set($event); onHotelChange()"
      optionLabel="name"
      optionValue="id"
      placeholder="Все отели"
      [showClear]="true"
      styleClass="w-full">
    </p-dropdown>
  </div>
  <button
    pButton
    type="button"
    label="Обновить"
    icon="pi pi-refresh"
    severity="secondary"
    (click)="loadRooms()">
  </button>
</div>

<p-table
  [value]="rooms()"
  [loading]="isLoading()"
  styleClass="p-datatable-gridlines"
  responsiveLayout="scroll"
  [paginator]="true"
  [rows]="10"
  [rowsPerPageOptions]="[10, 25, 50]">

  <ng-template pTemplate="header">
    <tr>
      <th>Номер</th>
      <th>Отель</th>
      <th>Категория</th>
      <th>Этаж</th>
      <th>Статус</th>
      <th>Состояние</th>
      <th>Комментарий</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-room>
    <tr>
      <td>
        <strong>{{ room.roomNumber }}</strong>
        <div class="muted">ID {{ room.id }}</div>
      </td>
      <td>{{ getHotelName(room.hotelId) }}</td>
      <td>{{ room.roomTypeName || '-' }}</td>
      <td>{{ room.floor || '-' }}</td>
      <td>
        <app-status-badge
          [label]="getStatusLabel(room.status)"
          [severity]="getStatusSeverity(room.status)">
        </app-status-badge>
      </td>
      <td>
        <p-dropdown
          [options]="housekeepingOptions"
          [ngModel]="room.housekeepingStatus"
          optionLabel="label"
          optionValue="value"
          (onChange)="changeHousekeepingStatus(room.id, $event.value)"
          styleClass="housekeeping-dropdown">
        </p-dropdown>
      </td>
      <td>{{ room.comment || '-' }}</td>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="7">
        <app-empty-state message="Номера не найдены. Добавьте первый номер!"></app-empty-state>
      </td>
    </tr>
  </ng-template>
</p-table>

<!-- ========================================================= -->
<!-- ДИАЛОГ: СОЗДАНИЕ НОМЕРА -->
<!-- ========================================================= -->
<p-dialog
  [visible]="displayDialog()"
  (visibleChange)="displayDialog.set($event)"
  [modal]="true"
  [style]="{ width: '500px' }"
  header="Новый номер"
  [closable]="true">

  <div class="room-form">
    <div class="field">
      <label for="hotelId">Отель *</label>
      <p-dropdown
        inputId="hotelId"
        [options]="hotels()"
        [(ngModel)]="newRoom.hotelId"
        optionLabel="name"
        optionValue="id"
        placeholder="Выберите отель"
        styleClass="w-full">
      </p-dropdown>
    </div>

    <div class="field">
      <label for="roomNumber">Номер комнаты *</label>
      <input
        id="roomNumber"
        type="text"
        pInputText
        [(ngModel)]="newRoom.roomNumber"
        placeholder="Например: 101"
        class="w-full" />
    </div>

    <div class="field">
      <label for="roomTypeId">Категория *</label>
      <input
        id="roomTypeId"
        type="number"
        pInputNumber
        [(ngModel)]="newRoom.roomTypeId"
        placeholder="ID категории"
        class="w-full" />
    </div>

    <div class="field">
      <label for="floor">Этаж</label>
      <p-inputNumber
        inputId="floor"
        [(ngModel)]="newRoom.floor"
        [min]="1"
        [showButtons]="true"
        styleClass="w-full">
      </p-inputNumber>
    </div>

    <div class="field">
      <label for="comment">Комментарий</label>
      <input
        id="comment"
        type="text"
        pInputText
        [(ngModel)]="newRoom.comment"
        placeholder="Например: тихая сторона"
        class="w-full" />
    </div>
  </div>

  <ng-template pTemplate="footer">
    <button
      pButton
      type="button"
      label="Отмена"
      severity="secondary"
      (click)="closeDialog()">
    </button>
    <button
      pButton
      type="button"
      label="Сохранить"
      icon="pi pi-check"
      [loading]="isSaving()"
      (click)="saveRoom()">
    </button>
  </ng-template>
</p-dialog>
